<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AsheraThrift.id</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>👕|Ashera.id|</h1>
          <p>Manajemen Produk & Penjualan</p>
        </div>

        <button class="btn-primary" onclick="openModal()">
          + Tambah Produk
        </button>
      </div>
    </header>

    <main>
      <!-- DASHBOARD -->

      <section class="dashboard">
        <div class="summary-card">
          <span>📦</span>

          <div>
            <small>Total Produk</small>

            <strong id="totalProduk"> 0 </strong>
          </div>
        </div>

        <div class="summary-card">
          <span>🟢</span>

          <div>
            <small>READY</small>

            <strong id="totalReady"> 0 </strong>
          </div>
        </div>

        <div class="summary-card">
          <span>🔴</span>

          <div>
            <small>SOLD</small>

            <strong id="totalSold"> 0 </strong>
          </div>
        </div>

        <div class="summary-card">
          <span>💰</span>

          <div>
            <small>Total Modal</small>

            <strong id="totalModal"> Rp 0 </strong>
          </div>
        </div>

        <div class="summary-card">
          <span>💵</span>

          <div>
            <small>Total Penjualan</small>

            <strong id="totalPenjualan"> Rp 0 </strong>
          </div>
        </div>

        <div class="summary-card">
          <span>📈</span>

          <div>
            <small>Total Profit</small>

            <strong id="totalProfit"> Rp 0 </strong>
          </div>
        </div>
      </section>

      <!-- SEARCH -->

      <section class="toolbar">
        <input
          type="search"
          id="searchInput"
          placeholder="🔍 Cari nama produk..."
          oninput="renderProducts()"
        />

        <select id="statusFilter" onchange="renderProducts()">
          <option value="ALL">Semua Status</option>

          <option value="READY">READY</option>

          <option value="SOLD">SOLD</option>
        </select>
      </section>

      <!-- LOADING -->

      <div id="loading" class="loading">Memuat data...</div>

      <!-- PRODUCTS -->

      <section id="productContainer" class="products"></section>
    </main>

    <!-- MODAL -->

    <div id="productModal" class="modal">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modalTitle">Tambah Produk</h2>

          <button class="close" onclick="closeModal()">×</button>
        </div>

        <form id="productForm">
          <input type="hidden" id="productId" />

          <div class="form-group">
            <label> Foto Produk </label>

            <input type="file" id="foto" accept="image/*" />

            <small> Maksimal 5 MB </small>

            <div id="previewContainer" class="preview-container"></div>
          </div>

          <div class="form-group">
            <label> Nama Baju * </label>

            <input
              type="text"
              id="nama"
              placeholder="Contoh: Kaos Oversize"
              required
            />
          </div>

          <div class="form-group">
            <label> Deskripsi </label>

            <textarea id="deskripsi" rows="4" placeholder="Deskripsi produk...">
            </textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label> Harga Beli * </label>

              <input type="number" id="hargaBeli" min="0" required />
            </div>

            <div class="form-group">
              <label> Harga Jual * </label>

              <input type="number" id="hargaJual" min="0" required />
            </div>
          </div>

          <div class="profit-preview">
            <span> Profit </span>

            <strong id="profitPreview"> Rp 0 </strong>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="closeModal()">
              Batal
            </button>

            <button type="submit" class="btn-primary">Simpan Produk</button>
          </div>
        </form>
      </div>
    </div>

    <!-- IMAGE VIEWER -->

    <div id="imageViewer" class="image-viewer" onclick="closeImage()">
      <button class="image-close">×</button>

      <img id="largeImage" src="" alt="Foto Produk" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
